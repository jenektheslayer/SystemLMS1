databaseChangeLog:
  - changeSet:
      id: create-courses-table
      author: andrew
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_course_teacher
                    references: teachers(id)